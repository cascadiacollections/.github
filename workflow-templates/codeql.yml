# Starter for Actions > New workflow.
# GitHub replaces $default-branch with the repository's default branch when this file is created.
# The matrix below analyzes GitHub Actions workflows only. Add a language entry for application code.
# Pins match KevinTCoughlin/godot-xdg-portals (.github/workflows/codeql.yml).
# Skip this file when the repository already uses CodeQL default setup.
# Change the cron minute if several repositories use this, so they don't all start together.
# Raise timeout-minutes if a larger repository needs it.

name: CodeQL

on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]
  schedule:
    - cron: "23 7 * * 2"

permissions:
  contents: read

# Cancel superseded PR runs only; push and schedule runs get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # Add languages this repository contains. build-mode none avoids a compile.
          # - language: javascript-typescript
          #   build-mode: none
          # - language: python
          #   build-mode: none
          # - language: c-cpp
          #   build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
